<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samsung Cloud Platform 운영 대시보드</title>
  <script src="vendor/chart.umd.min.js"></script>
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg-base:        #1a2236;
      --bg-elevated:    #243049;
      --bg-card:        #2c3a57;
      --bg-card-hover:  #344468;
      --bg-input:       #1e2840;
      --border:         #3b4a6b;
      --border-strong:  #4c5d80;
      --text-primary:   #f8fafc;
      --text-secondary: #d8dfeb;
      --text-muted:     #a3b0c9;
      --accent:         #7dd3fc;
      --accent-strong:  #38bdf8;
      --success:        #4ade80;
      --warning:        #fbbf24;
      --danger:         #f87171;
      --info:           #60a5fa;
    }

    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ===== Header ===== */
    .header {
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1e2a44 0%, #2a3654 100%);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .25);
    }

    .header h1 {
      font-size: 1.4rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand   { font-weight: 900; }
    .brand-s { color: var(--accent-strong); }
    .brand-c { color: var(--text-primary); }

    #clock {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: .82rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ===== Status Badge ===== */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 22px;
      font-size: .85rem;
      font-weight: 700;
    }

    .status-badge.ok   { background: #0e4d3a; color: #6ee7b7; border: 1px solid #16a34a55; }
    .status-badge.warn { background: #5a3208; color: #fcd34d; border: 1px solid #f59e0b55; }
    .status-badge.err  { background: #7a1429; color: #fda4af; border: 1px solid #ef444455; }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .5; transform: scale(1.3); }
    }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      background: var(--bg-elevated);
      border-bottom: 2px solid var(--border);
      padding: 0 32px;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 16px 24px;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color .2s;
    }

    .tab-btn:hover  { color: var(--text-secondary); }
    .tab-btn.active { color: var(--accent); }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
    }

    .tab-content        { display: none; }
    .tab-content.active { display: block; }

    /* ===== Layout ===== */
    .container {
      padding: 24px 32px;
      max-width: 1920px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1rem;
      color: var(--text-primary);
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== SLA Bar ===== */
    .sla-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .sla-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 22px;
      flex: 1;
      min-width: 160px;
      text-align: center;
    }

    .sla-item .sla-label {
      font-size: .72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 600;
    }

    .sla-item .sla-val {
      font-size: 1.7rem;
      font-weight: 800;
      margin-top: 6px;
      color: var(--text-primary);
    }

    .sla-item .sla-sub {
      font-size: .76rem;
      margin-top: 4px;
      color: var(--text-secondary);
    }

    /* ===== KPI Grid ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }

    .kpi-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(125, 211, 252, .12);
      border-color: var(--border-strong);
    }

    .kpi-label {
      font-size: .74rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 600;
    }

    .kpi-value {
      font-size: 1.85rem;
      font-weight: 800;
      margin: 6px 0 2px;
      color: var(--text-primary);
    }

    .kpi-sub { font-size: .8rem; color: var(--text-secondary); }

    .kpi-up   { color: var(--success); font-weight: 600; }
    .kpi-down { color: var(--danger); font-weight: 600; }
    .kpi-warn { color: var(--warning); font-weight: 600; }

    /* ===== Charts Grid ===== */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 16px;
      margin-bottom: 26px;
    }

    .chart-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border);
    }

    .chart-card h3 {
      font-size: .95rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Constrain chart canvas height */
    .chart-card canvas {
      max-height: 240px !important;
    }

    .chart-card.chart-tall canvas {
      max-height: 320px !important;
    }

    .chart-card.chart-compact canvas {
      max-height: 180px !important;
    }

    /* ===== Service Header & Filters ===== */
    .api-svc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .api-svc-header h3 {
      font-size: 1.05rem;
      color: var(--text-primary);
      font-weight: 700;
    }

    .api-svc-filters {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-svc-filters input,
    .api-svc-filters select,
    .tbl-header input,
    .tbl-header select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: .85rem;
      transition: border-color .15s;
    }

    .api-svc-filters input { width: 240px; }
    .api-svc-filters input::placeholder { color: var(--text-muted); }

    .api-svc-filters input:focus,
    .api-svc-filters select:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ===== Service Cards ===== */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .api-svc-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px 18px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }

    .api-svc-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-strong);
      box-shadow: 0 6px 20px rgba(125, 211, 252, .15);
      transform: translateY(-2px);
    }

    .svc-title {
      font-size: .98rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .svc-cat {
      font-size: .7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      font-weight: 600;
    }

    /* Status indicator chip */
    .svc-chip {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: .68rem;
      font-weight: 700;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
    }

    .svc-chip .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    /* ===== Service Metrics ===== */
    .svc-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .m-item   { text-align: center; }
    .m-val    { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; color: var(--text-primary); }
    .m-label  { font-size: .65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    /* ===== Tables ===== */
    .table-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .table-card h3 {
      font-size: .95rem;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      padding: 11px 18px;
      text-align: left;
      font-size: .85rem;
      color: var(--text-secondary);
    }

    th {
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-size: .72rem;
    }

    td              { border-top: 1px solid var(--border); }
    tr:hover td     { background: var(--bg-card-hover); }

    /* ===== Method Badges ===== */
    .method-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 5px;
      font-size: .72rem;
      font-weight: 700;
      font-family: 'Consolas', 'Monaco', monospace;
    }

    .method-get    { background: #0e4d3a; color: #6ee7b7; }
    .method-post   { background: #1e3a5f; color: #93c5fd; }
    .method-put    { background: #5c3a10; color: #fcd34d; }
    .method-patch  { background: #4a2070; color: #d8b4fe; }
    .method-delete { background: #7a1429; color: #fda4af; }

    /* ===== Severity ===== */
    .sev-c { color: var(--danger); font-weight: 700; }
    .sev-w { color: var(--warning); font-weight: 600; }
    .sev-i { color: var(--info); font-weight: 600; }

    /* ===== Modal ===== */
    .modal-bg {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 16, 30, .82);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }

    .modal-bg.show { display: flex; }

    .modal {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 0;
      max-width: 880px;
      width: 92%;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--text-primary);
      font-weight: 700;
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body table th {
      background: var(--bg-input);
    }

    .close-btn {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      transition: all .15s;
    }

    .close-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    /* Modal summary stats */
    .modal-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
    }

    .modal-stat .ms-label {
      font-size: .68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      font-weight: 600;
    }

    .modal-stat .ms-val {
      font-size: 1.3rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-primary);
    }

    /* ===== Tab 2 Specific ===== */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .compact-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 26px;
    }

    .compact-charts .chart-card canvas {
      max-height: 220px !important;
    }

    .top-services-table th,
    .top-services-table td {
      padding: 10px 18px;
    }

    /* Category accordion */
    .cat-accordion {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .cat-accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      cursor: pointer;
      background: var(--bg-card);
      transition: background .15s;
      user-select: none;
    }

    .cat-accordion-header:hover {
      background: var(--bg-card-hover);
    }

    .cat-accordion-header h4 {
      font-size: 1rem;
      color: var(--text-primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-accordion-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: .85rem;
      color: var(--text-secondary);
    }

    .cat-accordion-meta .meta-num {
      color: var(--text-primary);
      font-weight: 700;
    }

    .cat-arrow {
      transition: transform .2s;
      color: var(--text-muted);
      font-size: .8rem;
    }

    .cat-accordion.open .cat-arrow {
      transform: rotate(90deg);
    }

    .cat-accordion-body {
      display: none;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .cat-accordion.open .cat-accordion-body {
      display: block;
    }

    .compact-svc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .compact-svc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .compact-svc-card .svc-title {
      font-size: .92rem;
      margin-bottom: 8px;
    }

    .compact-svc-card .svc-metrics {
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .compact-svc-card .m-val {
      font-size: .95rem;
    }

    .mini-chart-wrap {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .mini-chart-label {
      font-size: .65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .mini-chart-wrap canvas {
      max-height: 60px !important;
    }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .compact-charts { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
      .cat-grid    { grid-template-columns: 1fr; }
      .table-card  { overflow-x: auto; }
      .svc-metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div>
      <h1>
        <span class="brand">
          <span class="brand-s">Samsung</span>
          <span class="brand-c">Cloud Platform</span>
        </span>
        운영 대시보드
      </h1>
      <div id="clock"></div>
    </div>
    <div class="status-badge ok" id="sys-status">
      <span class="dot"></span>
      <span>정상</span>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="system">서비스 현황</button>
    <button class="tab-btn" data-tab="services">서비스 제공 현황</button>
  </div>

  <!-- TAB 1: API 운영 현황 -->
  <div class="tab-content active" id="tab-system">
    <div class="container">
      <div class="sla-bar" id="sla-bar"></div>
      <div class="kpi-grid" id="api-kpis"></div>

      <div class="charts-grid">
        <div class="chart-card"><h3>📈 전체 호출 수 추이 (24h)</h3><canvas id="ch-trend-calls"></canvas></div>
        <div class="chart-card"><h3>⚡ 응답시간 추이 (P50/P99)</h3><canvas id="ch-trend-resp"></canvas></div>
        <div class="chart-card"><h3>🔴 오류 건수 추이 (404/500)</h3><canvas id="ch-trend-errs"></canvas></div>
        <div class="chart-card chart-tall"><h3>🏆 TOP 10 API 호출 서비스</h3><canvas id="ch-top10"></canvas></div>
      </div>

      <div class="api-svc-header">
        <h3>🔍 개별 서비스 현황 <span style="font-size:.78rem; color:var(--text-muted); font-weight:400">(카드를 클릭하면 상세 정보가 모달로 열립니다)</span></h3>
        <div class="api-svc-filters">
          <select id="api-cat-filter"><option value="">전체 카테고리</option></select>
          <input type="text" id="api-svc-search" placeholder="서비스 검색...">
        </div>
      </div>
      <div class="cat-grid" id="api-svc-grid"></div>

      <!-- TOP 20 오류 API -->
      <div class="api-svc-header" style="margin-top: 28px">
        <h3>🔴 TOP 20 오류 API</h3>
      </div>
      <div class="table-card">
        <div style="overflow-x: auto">
          <table>
            <thead>
              <tr>
                <th>서비스</th>
                <th>메서드</th>
                <th>API 경로</th>
                <th>설명</th>
                <th>호출/h</th>
                <th>오류/h</th>
                <th>오류율</th>
              </tr>
            </thead>
            <tbody id="top-err-tbl"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2: 서비스 제공 현황 -->
  <div class="tab-content" id="tab-services">
    <div class="container" id="svc-container"></div>
  </div>

  <!-- Modal -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-header">
        <h3 id="m-title"></h3>
        <button class="close-btn" id="m-close">✕ 닫기</button>
      </div>
      <div class="modal-body" id="m-body"></div>
    </div>
  </div>

  <script src="data/data.js"></script>
  <script src="config.js"></script>
  <script src="tab1.js"></script>
  <script src="tab2.js"></script>
</body>
</html>
